              { question: `لبدء الاستثمار بأموال فائضة، تقرأ أوصاف منتجات متعددة. كل وصف يحتوي كلمة "خطر". أي مما يلي يصف بأفضل شكل معنى "الخطر" في الاستثمار؟`, answer: `النتيجة غير مؤكَّدة، وتستلم أثرًا يطابق النتيجة التي تحدث` },
              { question: `هذا الجدول يُظهر كيف ينمو ٣٬٠٠٠ جنيه عند إدارته بـ٤% في السنة، بالفائدة الثابتة. بناءً على كيفية نمو الفائدة الثابتة، أي توليفة صحيحة للمبالغ في فراغات الجدول ① (بعد ١٠ سنوات) و② (بعد ٢٠ سنة)؟`, answer: `① ٥،٤٠٠②٤،٢٠٠` },
              { question: `هذا الجدول يُظهر كيف ينمو ٣٬٠٠٠ جنيه عند إدارته بـ٤% في السنة، بالفائدة المركبة. بناءً على كيفية نمو الفائدة المركبة، أي توليفة صحيحة للمبالغ في فراغات الجدول ① (بعد سنة واحدة) و② (بعد سنتين)؟`, answer: `① ٣،٢٤٥ ② ٣،١٢٠` },
              { question: `بقراءة كتاب استثمار، تظهر "قاعدة ٧٢"، طريقة لتقدير سنوات تضاعف المال تقريبًا. عندما يعطي استثمار عائدًا ٦% سنويًا، باستخدام هذه القاعدة، كم سنة تقريبًا حتى يتضاعف المال الأصلي؟`, answer: `حوالي ١٢ سنة` },
              { question: `بمعرفة أن الفائدة المركبة تنمو أكثر في النصف الثاني كلما جعلت الوقت حليفك، تقارن بين عدة إدارات. من بين التالية، عند الإدارة بالفائدة المركبة، باستخدام "قاعدة ٧٢"، أيها يحقق أكبر مقدار من النمو في النهاية؟ (نسبة النمو ٥% في السنة لكلها.)`, answer: `إدارة ١٬٠٠٠ جنيه لمدة ٣٠ سنة` },
              { question: `نحو حلمك في فتح محلك الخاص يومًا ما، تريد تحضير مال بدء تشغيل كبير. أي مما يلي أفضل طريقة لتحضير المال؟`, answer: `احتفظ بتكاليف المعيشة وصندوق الطوارئ، وضع الأموال الفائضة جانبًا بشكل منهجي` },
              { question: `عمرك ٣٥ سنة، وطفل انضم للأسرة. مع وجود أكثر لحمايته، تفكّر بجدّية في التحضير للطوارئ. ما المقصود بـ"المخاطر" التي تحتاج إلى الاستعداد لها؟ أي مما يلي يشرح ذلك بأفضل شكل؟`, answer: `متى واحتمال حدوثه غير معروفين، لكن بمجرد حدوثه له أثر كبير على الحياة` },
              { question: `وُلِد طفل، وتفكّر في أخذ تأمين جديد للأسرة. مع التأمين، قسط صغير يوفّر تحضيرًا كبيرًا للطوارئ. أي مما يلي يشرح بأفضل شكل لماذا يصح هذا؟`, answer: `لأنه إذا وضع أشخاص كثيرون قليلًا كل واحد، يمكن تغطية تكلفة حدث لا يحدث للجميع دفعة واحدة` },
              { question: `بينما تفكّر في التحضير لطفلك، تتحقّق من تفاصيل "تأمين تعاضدي" معين. لهذا التأمين ١٬٠٠٠ مشترك، يضع كل واحد ٦٠٠ جنيه سنويًا، بإجمالي ٦٠٠٬٠٠٠ جنيه. هذا العام، ١٠ أشخاص ضربهم سوء الحظ استلموا ٥٠٬٠٠٠ جنيه كل واحد (٥٠٠٬٠٠٠ جنيه إجمالًا)، والـ١٠٠٬٠٠٠ جنيه المتبقية أصبحت تكاليف تشغيل. من الـ٦٠٠ جنيه التي دفعتها، أي مما يلي هو التقسيم الصحيح لـ"الجزء المُستخدَم لإغاثة شخص" و"الجزء الذي ذهب لتكاليف التشغيل"؟`, answer: `الإغاثة: ٥٠٠ جنيه / التكاليف: ١٠٠ جنيه` },
              { question: `بتنظيم التأمين الذي اشتركت فيه، تتعلّم أنه بجانب التأمين الذي تختاره وتلتحق به بنفسك، هناك تأمين تديره الدولة. التحضير للمرض والإصابة والشيخوخة والبطالة وما شابه، حيث يُسجَّل من يستوفون الشروط تلقائيًا، أي مما يلي يُعد تأمينًا عامًا من هذا النوع؟`, answer: `تأمين اجتماعي يلتحق به العاملون وغيرهم، يدعم الرعاية الطبية والمعاشات والبطالة` },
              { question: `بينما تراجع التحضيرات كأسرة، تتعلّم أن التحضير للطوارئ له ثلاث طبقات: "المساعدة الذاتية"، و"التعاضد"، و"المساعدة العامة". أي مما يلي تطابقه ①-③؟ أي توليفة صحيحة؟ ① صندوق طوارئ مُدَّخَر بثبات في حسابك الخاص ② تأمين خاص يضع فيه كثيرون أقساطًا ويدفع لمن في مأزق ③ ضمان اجتماعي مُغطًّى بالضرائب واشتراكات التأمين الاجتماعي، تديره الدولة`, answer: `① مساعدة ذاتية ② تعاضد ③ مساعدة عامة` },
              { question: `بينما تبحث في خيارات التأمين، تتعلّم عن "التكافل"، آلية تعاضد تنتشر في مصر أيضًا. أي مما يلي يصف بأفضل شكل خاصية التكافل؟`, answer: `الدفعات تأتي من تعاضد المشتركين، والمتبقي يعود للمشتركين` },
              { question: `في عطلة نهاية أسبوع، بينما تراجعون ميزانية الأسرة كأسرة، تناقشون كيفية التحضير لمصروفات الطوارئ. للمصروفات الصغيرة اليومية والمصروفات الكبيرة النادرة، أيهما منطقي للتحضير به، "الادّخار" أو "التأمين"، على التوالي؟`, answer: `المصروفات الصغيرة: الادّخار / المصروفات الكبيرة: التأمين` },
              { question: `بعد تحضير مجموعة كاملة من التحضيرات لطفلك، تراجع ما إذا كانت تناسب ميزانية أسرتك. ما أقل طريقة تفكير مناسبة للتحضير للمخاطر؟`, answer: `بما أن تأمينًا أكثر يعني أمانًا أكثر، زد التأمين حتى إذا كانت الميزانية ضيقة` },
              { question: `عمرك ٣٨ سنة، تبدأ تحضيرات فتح محلك الخاص الذي طال انتظاره. تفكّر في كيفية دفع المعدات المُستخدَمة في الفتح (السعر المُعلَن ٣٠٬٠٠٠ جنيه). لديك مساحة في أموالك في اليد. هذا الجدول يُظهر ثلاث طرق دفع مع رسومها الإضافية (أو رسوم الفائدة) ومقادير الدفع الإجمالية النهائية. أي طريقة دفع هي الأكثر منطقية؟`, answer: `الدفع دفعة واحدة. لأنه لا مبلغ إضافي يُطبَّق ولديك مساحة في الأموال في اليد` },
              { question: `بعد الفتح، تشتري المعدات اللازمة. للحفاظ على النقد في اليد، تقرر الدفع ببطاقة ائتمان. لتقليل عبء رسوم البطاقة إلى الحد الأدنى، أي مما يلي طريقة الدفع الأنسب؟`, answer: `ادفع دفعة واحدة الشهر القادم، دون زيادة الرسوم الإضافية` },

              { question: `تدفع لاحقًا مقابل معدات فتح بقيمة ٢٠٬٠٠٠ جنيه للحفاظ على النقد في اليد. عندما تُطبَّق رسوم ١٠% لاستخدام المال لفترة إضافية، ما المقدار الإجمالي النهائي للدفع؟`, answer: `٢٢٬٠٠٠ جنيه` },
              { question: `أنت على وشك شراء معدات للمحل بالدفع بالتقسيط. لتقييم خطر السداد طويل المدى بشكل صحيح، أي مما يلي أنسب عقلية قبل التقديم؟`, answer: `اعتبر تغيّرات الدخل والمقدار الإجمالي شاملًا المُضاف، أكّد أنك تستطيع الدفع دون ضغط، وقدّم` },
              { question: `بعد الفتح بفترة قصيرة، يقترب منك عرض: "اكسب كبيرًا بشكل موثوق بلا رأس مال". من بين ①-④ التالية، أي توليفة تجمع الخصائص المشتركة للدعوات المشبوهة؟ ① التأكيد "ستكسب مالًا بالتأكيد" ② جعلك تؤكّد محتويات العقد كتابيًا بثبات ③ إرباكك بـ"الآن فقط"، "أنت فقط" ④ إغراؤك بأن المال سيأتي إذا أحضرت آخرين`, answer: `①③④` },
              { question: `بالنظر مستقبلًا لتوسيع محلك، تفكّر في الطريقة الصحيحة للتعامل مع الدين. ما الأقل مناسبة كطريقة تفكير في "الدين الجيد والدين السيء"؟`, answer: `إذا نقص مال السداد، اقترض من جديد من شركة أخرى لملء فجوة السداد الحالية` },
              { question: `عمرك ٤٥ سنة، وكمدير، تتحقّق دائمًا من حالة إدارة شركاء أعمالك (الائتمان). أخبار عن شريك معين أفادت بـ"أزمة تخلّف عن السداد (عدم أداء الواجب)". ما الحالة التي تشير إليها؟`, answer: `حالة عدم القدرة على سداد مال وعد بسداده (دين أو سعر) كما وُعِد` },

              { question: `محل قرطاسية إلكتروني صغير يفكّر في التحوّل إلى صناديق أرق لتقليل تكاليف الشحن. أي مما يلي هو العامل الأكثر ملاءمة للنظر فيه إلى جانب تقليل التكلفة؟`, answer: `التفكير مع النظر إلى هل يجعل ترقيق الصندوق المنتجات أكثر عرضة للتلف، مع التوازن مقابل التكلفة` },

          {
            title: `اختبار المعرفة: محاكاة رائد الأعمال - من الفكرة إلى المشروع`,
            questions: [
              { question: `إنه اليوم الأول الذي انتقلت فيه إلى مركز بدء المشاريع. تنضم إلى "لقاء تبادل" يتحدّث فيه السكان عن كيفية تقدّم مشاريعهم الخاصة. بينما يتحدّث الجميع بشغف عن أفكارهم وأفعالهم الحالية، من يُظهر أكثر ريادة الأعمال، حتى دون أن يكون قد بدأ شركة بعد؟`, answer: `"بما أنني لاحظت مشكلة قريبة مني، بدأت أولًا خدمة تجريبية صغيرة (منتج أولي قابل للتطبيق) في مجموعة على وسائل التواصل الاجتماعي. الآن أصلحها بشدة بناءً على انتقادات من استخدمها"` },
              { question: `بعد أيام قليلة من الانتقال. بالنظر حول المرفق، رواد أعمال يحملون أهدافًا مختلفة يتحرّكون بنشاط. قبل تحديد أي اتجاه يهدف إليه مشروعك الخاص، فلنرتّب أولًا الأنواع الثلاثة النموذجية لبدء المشروع التجاري (الشركة الناشئة، المشروع الصغير، ريادة الأعمال الاجتماعية). أي نوع تنتمي إليه المشاريع ① إلى ③ أدناه؟ ① مشروع يهدف إلى الانتشار في العالم كله دفعة واحدة في وقت قصير، باستخدام تقنية أو أفكار جديدة ② مشروع كمطعم عائلي، حيث يكون المالك متجذّرًا في المنطقة المحلية ويُقدّر الاستمرار بثبات وطويلًا ③ مشروع يجعل خلق أماكن عمل في منطقة قليلة أماكن العمل هدفه الأول، ويستخدم الربح المُكتسَب لحل تلك المشكلة الاجتماعية`, answer: `① شركة ناشئة ② مشروع صغير ③ ريادة أعمال اجتماعية` },
              { question: `بعد أيام قليلة من الانتقال، يسأل مرشد إداري خبير (مستشار) عن فكرتك: "فلنوضّح نقطة انطلاق مشروعك. أي مما يلي يفسّر بأفضل شكل المعنى الأساسي لـ'خلق القيمة'، أساس كل بدء مشروع تجاري؟" أي مما يلي يفسّر خلق القيمة بأفضل شكل؟`, answer: `إيجاد وحل مشكلة شخص ما أو "لكان من الجيد لو وُجد هذا"، وتوليد فائدة جديدة لم تكن موجودة من قبل` },
              { question: `في أيام تنقية الأفكار، تنضم إلى عرض تقديمي لفكرة مشروع تجاري. يقدّم الزملاء جهودهم بشغف. من بين ① إلى ④ أدناه، أي منها هو التركيبة المناسبة لتلك التي تُحسب أمثلة نجاح لـ"الابتكار"؟ ① غيّر حجوزات تمرين الفريق من الكتابة في سجل ورقي إلى آلية غير مسبوقة يمكنك فيها الحصول على موعد شاغر في أي وقت عبر هاتفك، مزيلًا المشكلة لكثير من الناس ② ابتكر منافسة سعرية بتخزين مشروب موجود بالجملة وبيعه أرخص قليلًا من المحل المجاور ③ يبحث عن مادة تزيل الأوساخ بشكل أفضل، طالبًا مواد مختلفة ومكرّرًا النمذجة والتجارب كل يوم في مختبره الخاص ④ لمساعدة تنقّل كبار السن للتسوق، صنع آلية مشاركة تنقّل غير مسبوقة تربط المقاعد الشاغرة في سيارات الحي عبر تطبيق وتقديم توصيلات بمقابل صغير`, answer: `① و ④` },
              { question: `تعلمت من مرشد أن "عرض القيمة الجيد يصل بنظرة واحدة: لمن هو، وما المشكلة التي يحلها، وما القوة الفريدة التي تستخدمها لحلها." أولًا، كتبت عرض قيمة يستهدف زملاء المركز (العملاء) على السبورة المشتركة للمركز هكذا. أي مما يلي يحدّد بأفضل شكل "الجمهور المستهدف"، و"المشكلة"، و"القوة الفريدة" المُعبَّر عنها في هذه العبارة؟ "بعد النادي أو التمرين، حتى دون ماء، تنظف الأحذية المُغطّاة بالطين في دقائق قليلة. قابلة للاستخدام في لمح البصر حتى بين التنقّلات!"`, answer: `لمن = أشخاص تتغطّى أحذية كرة القدم لديهم بالطين في التمرين / المشكلة = لا يوجد مصدر ماء قريب، ولا يمكنهم تنظيفها فورًا في الموقع / القوة = إزالة الأوساخ في دقائق قليلة دون ماء، حتى بين التنقّلات` },
              { question: `بعد إنهاء عرض الفكرة، تُظهر للمرشد (المستشار) صورة النموذج الأولي لـ"سلع العناية بحذاء كرة القدم" التي كنت ترعاها. يقول المرشد: "فكرة مثيرة للاهتمام. من هنا، 'المخاطرة المحسوبة' التي تحافظ على الفشل صغيرًا مهمة." عند تطوير المشروع مع تقليل خطر الفشل بأقصى قدر ممكن، أي مما يلي هو الفعل الأكثر ملاءمة كـ"مخاطرة محسوبة"؟`, answer: `صنع كمية صغيرة فقط أولًا، والبحث عن أشخاص يدفعون فعلًا للشراء، والتأكد من ردهم` },
              { question: `إنها مرحلة قبل الصنع بجدية. تبدأ بفتح الشاشة لطلب مواد بالجملة، ثم توقف يدك. لعدم الانزعاج بصنع الكثير هدرًا، تتأكد أولًا من وجود أشخاص يريدونه فعلًا. كـ"دراسة سوق"، أي مما يلي هو الفعل الأكثر ملاءمة؟`, answer: `سؤال زملاء المركز في الرياضة الناشئة وطلاب النادي الفعليين مباشرة عن أساليب العناية المعتادة والخطوات كثيفة العمالة، والتأكد` },
              { question: `بعد التأكد من وجود أشخاص يريدونه، حول وقت محاولة التقدّم إلى الخطوة القادمة، يصرخ مرشد المركز، "أولًا من المنتج الأولي القابل للتطبيق." أي مما يلي يفسّر المنتج الأولي القابل للتطبيق بأفضل شكل؟`, answer: `صنع منتج أو خدمة تجريبية مُضيَّقة إلى النقطة الأهم فقط في الفكرة، وإصلاحها خلال مراقبة ردود العملاء` },
              { question: `بدأت الأفعال اللازمة لبدء مشروع تجاري تصبح واضحة تدريجيًا. مع زملاء دفعة المركز، بلصق ملاحظات لاصقة على السبورة الجدارية، تناقشون الخطة القادمة. من بين ① إلى ④ أدناه، من منظور التقدّم مع التأكد من الفكرة، أي مما يلي يرتّب بشكل صحيح فقط الخطوات اللازمة للمضي قدمًا بثبات مع خطر قليل، بالترتيب الصحيح؟ ① [منتج أولي قابل للتطبيق] صنع كمية صغيرة فقط من السلع والاختبار ② [دراسة السوق] سؤال من يتمرّنون مباشرة عن مشكلات العناية لديهم ③ [عرض القيمة] تلخيص قوة "التنظيف دون ماء" ④ [إجراءات التأسيس] تقديم الوثائق اللازمة للافتتاح إلى المكتب الحكومي`, answer: `①← ②← ③` },
              { question: `في يوم أثناء تطوير التحضيرات، يحكي رواد أعمال كبار بدؤوا مشاريع من قبل "قصص فشل" عن اقترابهم من الإفلاس في الماضي. أي من المخاطر الثلاثة لبدء المشروع التجاري (الخطر المالي، خطر المنافسة، خطر السوق) تنتمي إليه كل من ① إلى ③ أدناه؟ ① الكبير أ: بعد نصف عام من الافتتاح، كان الإيراد ينمو بثبات، لكن الدفعات تراكمت على مدى بضعة أشهر، وكانت هناك إمكانية عدم القدرة على دفع تكلفة التخزين ② الكبير ب: صنع وباع سلعًا أصلية معيّنة، لكن منتجات بتصميم مشابه كانت مُتداوَلة على نطاق واسع بالفعل، وانطمرت منتجاته الخاصة ③ الكبير ج: عقد ورشة عمل واكتمل عدد المشاركين، لكن كثيرًا من المشاركين قالوا "فعاليات كهذه شائعة بالقرب، ويجب أن تكون أرخص لنا لنأتي المرة القادمة"`, answer: `① الخطر المالي ② خطر المنافسة ③ خطر السوق` },
              { question: `في تشكيل سلع النموذج الأولي، تقرر القيام بـ"إدارة الخطر المالي" بشكل شامل بحيث تستطيع الحفاظ على أموال الافتتاح حتى قليلًا. باستخدام بيئة مركز بدء المشاريع، أي طريقة للمضي قدمًا تتيح لك صنع النموذج الأولي بينما تترك المال بأذكى شكل؟`, answer: `استئجار معدات ورشة العمل المشتركة للمركز بسعر رخيص، وتجميع النموذج الأولي الأول أولًا ضمن ميزانية بضعة آلاف من الجنيهات المتوفرة فقط` },
              { question: `أثناء تطوير التحضيرات، يخبرك كبير في المركز، "مشروع خارجي عبر الإنترنت بدأ ببيع سلع عناية بحذاء كرة القدم تمامًا كفكرتك." فبحيث، عندما يخرج الأمر أخيرًا إلى العالم، تُختار سلعك بدلًا من سلع المنافس، تخطط لإجراءات مقابلة الآن. كطريقة مواجهة هذا "خطر المنافسة"، أي مما يلي هو الاستراتيجية الأكثر ملاءمة؟`, answer: `تحسين القوة الفريدة الخاصة بسلعك أكثر - القدرة على التنظيف بسرعة دون ماء - وتقديمها للعملاء` },
              { question: `أصبحت نقاط التمييز التي لن تخسر أمام المنافسين واضحة. تستشير المرشد: "أريد اختبار النموذج الأولي ليس فقط مع زملاء المركز بل مع فرق كرة قدم محلية. أريد أيضًا جمع أموال تطوير حقيقية." يقول المرشد، "من هنا فصاعدًا، هذه مرحلة استخدام 'منظومة الشركات الناشئة (آلية المجتمع الداعمة لبدء المشاريع)' المنتشرة خارج المركز أيضًا." أي طريقة للمضي قدمًا تستخدم هذه المنظومة بأفضل شكل؟`, answer: `استخدام الشبكات المتعددة التي يربطك بها المركز - "الحكومة المحلية،" "مختبر جامعي،" "فريق رياضي إقليمي" - لتطوير المشروع` },
              { question: `تواصلت مع "المنظومة" - مكاتب الإعانات الحكومية والفرق الرياضية الإقليمية. لتُدعَم رسميًا وتُشرِك المنطقة كلها، تلخّص "الأهمية الاجتماعية" لمشروعك في عرض تقديمي. أي مما يلي هو التركيبة الصحيحة لـ"الأهميات الكبرى الثلاث التي يجلبها بدء المشروع التجاري للمجتمع بأكمله"، بعيدًا عن ربحك الخاص فقط؟`, answer: `خلق أماكن عمل، الابتكار، حل مشكلات إقليمية` },
              { question: `مع عرض تقديمي يلخّص الأهمية الاجتماعية في يدك، تقف في "عرض النموذج الأولي" الذي يستضيفه المركز. أمام مدرّبي فرق كرة قدم إقليمية مدعوّين، أنجزت عرض وتجربة سلع حذاء كرة القدم. لكن بعد ذلك، يقدّم مدرّب ملاحظات: "فكرة إزالة الطين دون ماء هي الأفضل. لكن بهذا الحجم والاستخدام كما هو، من الصعب نوعًا ما التعامل معه في ملعب مُغطّى بالطين." كرائد أعمال، أي مما يلي هو الطريقة الأكثر ملاءمة لمواجهة هذه "المشكلة الجديدة" التي طُرحت عليك بالضبط لأنك طبّقت الأمر عمليًا؟`, answer: `أخذ حتى الملاحظة القاسية كبيانات مهمة لتحسين المنتج، وسؤال المدرّب عن تفاصيل عدم رضاه، والبدء في تحضير النموذج الأولي القادم بتحسين شكل السلعة ومواصفاتها` },
              { question: `بناءً على ملاحظة المدرّب، تبدأ في تحسين شكل السلعة وقابلية استخدامها. يدعوك المرشد: "بعيدًا عن إصلاح تفاصيل المنتج، فلنحدّث معًا أيضًا آلية المشروع بأكملها (نموذج العمل) لـ'لمن، وماذا، وكيفية التوصيل، وكيفية توليد الإيراد،'" وتنضم إلى "ورشة تصميم نموذج العمل" في المركز. قبل الانضمام إلى الورشة، تفكّر في تلخيص أفكارك داخل نفسك مسبقًا. أي مما يلي هو الطريقة الأفضل لتجميع آلية مشروعك مسبقًا؟`, answer: `الاستناد إلى الملاحظات المُستلَمة فعليًا من المدرّبين، وإعادة التفكير في آلية المشروع، وترتيبها بإصلاحها مرات كثيرة خلال الاختبار الفعلي` },
              { question: `بدأت "ورشة تصميم نموذج العمل" بجدية. يقف المدرّب أمام السبورة ويسأل، "قبل تعبئة الورقة، فلنتأكد أولًا من الأساسيات معًا. ما هو 'نموذج العمل' الذي نحن على وشك تصميمه بالضبط؟" أي مما يلي يفسّر نموذج العمل (آلية المشروع) بأفضل شكل؟`, answer: `الآلية الكاملة لتوليد المال التي تجيب عن الأسئلة الأربعة "لمن، وماذا، وكيفية التوصيل، وكيفية توليد الإيراد"` },
              { question: `انتهى محاضرة الورشة، وحان وقت العمل الفردي. على ورقة تصميمك، ترتّب بشكل صحيح الملاحظات اللاصقة الأربع (① إلى ④) مع فكرة مشروع منظّف حذاء كرة القدم في المجالات الأربعة "لمن، وماذا، وكيفية التوصيل، وكيفية توليد الإيراد." أي مما يلي هو التركيبة الصحيحة لمنطقة الورقة والملاحظة اللاصقة؟ ① نقطة تواصل يمكنهم فيها استلامه فعليًا، كمحل أو موقع فعالية ② أشخاص منزعجون من اتساخ حذاء كرة القدم بعد التمرين ③ وسيلة للاستمرار في توليد المال بشكل مستمر بالشراء بالجملة أو المجموعات، دون الاعتماد على الدفع بالقطعة الواحدة فقط ④ فائدة القدرة على التنظيف بسرعة دون ماء`, answer: `① كيفية التوصيل ② لمن ③ كيفية توليد الإيراد ④ ماذا` },
              { question: `يتقدّم العمل الفردي في الورشة، وتُظهر أوراق التصميم لبعضكما مع الزميل في المقعد المجاور. يشرح الزميل فكرته: "للأشخاص الذين يحبون الفن، أريد صنع بطاقات بريدية بتصميم خاص ووضعها في محلات محلية أنيقة بحيث يستلمها الناس." من بين الأسئلة الأربعة لنموذج العمل، أي عنصر لا يزال غير واضح في هذا التفسير؟`, answer: `كيفية توليد الإيراد: وسيلة توليد المال (الإيراد) التي تحافظ على استمرار المشروع` },
              { question: `في الورشة، يجلب زميل من مجموعة أخرى ورقة تصميمه: "عبّأت العناصر الأربعة كلها، لكن المرشد أخبرني أن هناك تناقضًا كبيرًا. هل يمكنك تحديد أين المشكلة؟" أي عنصر من نموذج العمل لا يتلاءم مع وضع العميل المستهدف؟ مشروع يبيع لوازم يومية أساسية تُستخدَم في الحياة اليومية، لأشخاص لديهم أطفال صغار ولا يمكنهم الخروج للتسوق بسهولة. يُستلَم الدفع فقط بمقدار المنتجات المُباعة، ويأتون إلى المحل ويختارون ويشترون بأنفسهم.`, answer: `كيفية التوصيل (طريقة/مسار البيع)` },
              { question: `إنه النصف الثاني من الورشة. يقول المدرّب، "لتصميم 'كيفية توليد الإيراد' في الورقة، فلنفهم أولًا الأنواع الأربعة النموذجية في العالم (نماذج الإيراد)،" ويعرض حالات فعلية (① إلى ④) لكبار المركز. أي مما يلي هو التركيبة الصحيحة للأنواع المُلائمة لكل حالة؟ ① بيع سلع عناية مريحة طوّرها واحدة تلو الأخرى في المحلات أو عبر الإنترنت واستلام الدفع ② دفع رسم شهري يجعل معدات ورشة المركز الغالية قابلة للاستخدام في أي وقت لشهر، دون حدود ③ تشغيل موقع مطابقة يربط أشخاصًا يريدون البيع وأشخاصًا يريدون الشراء، واستلام رسم بنسبة قليلة في كل مرة تتم فيها معاملة ④ توزيع تطبيق صور عالي الوظائف يمكن لأي شخص استخدامه مجانًا، وتقديم خطة مدفوعة أيضًا فقط لمن يريدون تحريرًا متقدمًا، للكسب`, answer: `① نموذج الدفع لمرة واحدة ② نموذج الاشتراك ③ نموذج المنصة ④ نموذج فريميوم` },
              { question: `من بين نماذج الإيراد، هناك آلية رائعة يمكنها الحفاظ على استمرار مشروع حتى دون استلام تكاليف أولية من المستخدمين. لتحويل "تطبيق خرائط يمكن لأي شخص استخدامه مجانًا" طوّره أحد كبار المركز إلى آلية تستمر في توليد المال، أي مما يلي هو التصميم الأكثر ملاءمة؟`, answer: `عرض إعلانات على الشاشة للحصول على دخل إعلاني من المعلنين، بينما تجعل ميزات أكثر راحة خطة شهرية مدفوعة، للكسب` },
              { question: `في الورشة، ظهرت آلية "الامتياز التجاري" أيضًا. أي مما يلي يصف بأفضل شكل الامتياز التجاري؟`, answer: `منح حق استخدام "اسم" و"أساليب إدارة" مشروع ناجح كحزمة لآخرين، ونشره على نطاق واسع وبسرعة عبر المناطق بجودة موحّدة` },
              { question: `ورشة تصميم نموذج العمل في مرحلتها الأخيرة. بناءً على نماذج الإيراد المختلفة التي تعلمتها، تحدد طريقة استلام مشروعك للدفع. أولًا، تبدأ من شكل "تقديم منظّف حذاء كرة القدم المكتمل للعملاء كمنتج نهائي واستلام الدفع مقابله." كنوع نموذج العمل الذي تتناسب معه طريقة البيع هذه أكثر، أي مما يلي هو؟`, answer: `نموذج الدفع لمرة واحدة، صنع وتقديم المنتجات بنفسك واستلام الدفع مقابلها` },
              { question: `تم تحديد أساس نموذج الإيراد كـ"نموذج الدفع لمرة واحدة." لجعل الإيراد أكثر استقرارًا، تفكّر في "وسيلة واحدة أخرى" بدمج نوع آخر على هذا الأساس. كطريقة رفع الإيراد الأكثر تلاؤمًا طبيعيًا مع خاصية المنتج بأن "منظّف حذاء كرة القدم ينفد بعد استخدامات قليلة،" أي مما يلي هو؟`, answer: `بما أنه منتج استهلاكي، دمج شكل من التوصيل المنتظم وجعلهم يستمرون في استخدامه (إيراد متكرر / اشتراك)` },
              { question: `تم تحديد "نموذج الإيراد" الخاص بك، فمن هنا تصمّم بشكل ملموس تدفّق مال المشروع. في عالم الأعمال، تُسمّى هذه طريقة دخول المال "تدفّق الإيراد." أي مما يلي يفسّر تدفّق الإيراد بأفضل شكل؟`, answer: `طريقة تحقيق الإيرادات - بأي شكل (الدفع لمرة واحدة، الإيراد المتكرر، العمولة، إلخ) تستلم مقابل القيمة المُقدَّمة` },
              { question: `لتصميم تدفّق الإيراد (طريقة تحقيق الإيرادات) بشكل ملموس، ترتّب ميزات الأنواع الثلاثة النموذجية (نموذج الدفع لمرة واحدة، نموذج العمولة، نموذج الإيراد المتكرر). أي مما يلي هو التركيبة الصحيحة لـ① إلى ③ والنوع المُلائم؟ ① بيع منتجات مصنوعة واحدة تلو الأخرى واستلام ذلك الدفع في الموقع ② الوساطة بين أشخاص يريدون طلب خدمة وأشخاص يريدون تقديمها، واستلام جزء من مقدار المعاملة في كل مرة تُقرَّر معاملة ③ استلام رسم محدد (مبلغ ثابت) كل شهر، وجعل مساحة معيّنة قابلة للاستخدام في أي وقت، بأي قدر تريد`, answer: `① نموذج الدفع لمرة واحدة ② نموذج العمولة ③ نموذج الإيراد المتكرر` },
              { question: `تم تحديد نموذج الإيراد (نموذج الدفع لمرة واحدة)، فبعد ذلك تتأكد من كم من الربح يبقى في اليد في كل مرة تبيع فيها منظّف حذاء كرة قدم واحدًا. بناءً على أرقام هذا الجدول، كم من الربح يبقى في كل مرة يُباع واحد؟`, answer: `٨٠ جنيهًا` },
              { question: `بما أن منظّف حذاء كرة القدم "منتج استهلاكي" ينفد مع الاستخدام، إذا أحبّه، يشتري نفس العميل مرارًا وتكرارًا. تُقدّر إجمالي الربح الذي يجلبه عميل واحد بين أول شراء له وحين يتوقف عن الشراء - أي "القيمة الدائمة للعميل (LTV)." بناءً على أرقام هذا الجدول، ما هي القيمة الدائمة للعميل لكل عميل؟`, answer: `٥٦٠ جنيهًا` },
              { question: `تُقدّر كم من التكلفة يتطلبه جمع عميل واحد جديد. في عالم الأعمال، تُسمّى هذه تكلفة اكتساب عميل واحد "تكلفة اكتساب العميل (CAC)." بناءً على أرقام هذا الجدول، ما هي تكلفة اكتساب العميل لكل شخص؟`, answer: `١٠٠ جنيه` },
              { question: `من الحسابات حتى الآن، واضح أن إجمالي الربح الذي يجلبه عميل واحد (LTV) يتجاوز بشدة تكلفة اكتساب ذلك الواحد (CAC). تحكم على هل من المقبول إنفاق مال لزيادة العملاء لهذا المشروع. أي مما يلي يصف بأفضل شكل الحالة الراهنة لهذا المشروع؟`, answer: `بما أن إجمالي الربح من شخص واحد (القيمة الدائمة) يتجاوز تكلفة جمع ذلك الواحد (تكلفة الاكتساب)، إذا أمكن الحفاظ على كفاءة الاكتساب الحالية، هناك احتمال لتراكم الربح` },
              { question: `كإنهاء للتصميم، تتوقّع هل يمكن نشر المشروع بشكل كبير في المستقبل. أي مما يلي يفسّر بأفضل شكل "قابلية التوسّع،" خاصية مهمة لنشر مشروع بشكل كبير؟`, answer: `الخاصية التي، حتى مع زيادة العملاء، يمكنك التعامل معها دون زيادة العمل أو التكلفة الإضافية كثيرًا، ويرتفع هامش الربح مع توسّع الإيراد` },
              { question: `في مركز بدء المشاريع، تتحقق من سياسة التشغيل لتوسيع مشروع منظّف حذاء كرة القدم المُطوَّر بشكل انفجاري في وقت قصير. من بين ما يلي، أي طريقة للمضي قدمًا لديها أعلى "قابلية توسّع" وأسهل في التعامل مع زيادة طلب مفاجئة؟`, answer: `توحيد خطوات التصنيع تمامًا لبناء نظام للإنتاج الضخم دفعة واحدة، والتعامل مع طفرة طلبات مفاجئة بفعالية بنفس الطريقة` },
              { question: `قبل طرح منظّف حذاء كرة القدم للبيع، لتوقّع الدخل والمصروفات الشهرية بشكل صحيح، ترتّب آلية التكلفة. عند التفكير في كل التكاليف مقسّمة إلى "تكاليف ثابتة" و"تكاليف متغيرة،" كتفسير لـ"التكلفة المتغيرة" من بين هذه، أي مما يلي هو الأكثر ملاءمة؟`, answer: `تكلفة يزيد أو ينخفض إجمالي مقدارها الحاصل بالتناسب مع زيادة أو انخفاض كمية المبيعات` },
              { question: `قبل طرحه للبيع، لتوقّع الدخل والمصروفات الشهرية، ترتّب التكاليف القادمة واحدة تلو الأخرى. من بين التكاليف التالية، أيها يُحسب "تكلفة ثابتة" - مقدار محدد يحدث كل شهر بغض النظر عن زيادة أو انخفاض كمية المبيعات (المبيعات)؟`, answer: `إيجار المكان المُستأجر كمساحة عمل` },
              { question: `لزيادة الربح أكثر بينما تستمر في البيع، تفكّر في "إعادة النظر في تكلفة المواد (تكلفة متغيرة) لجعلها أرخص" لتحسين الربح لكل منتج. في هذا الوقت، بناءً على "المقايضة" بين التكلفة والجودة، أي مما يلي هو الطريقة الأكثر ملاءمة للرؤية؟`, answer: `الحكم برؤية كلا التأثيرين - أثر تقليل التكلفة والأثر على الإيراد من تغيّر الجودة أو قابلية الاستخدام` },
              { question: `في مرحلة توقّع سعر البيع والتكاليف، تتأكد من كيفية إيجاد "نقطة التعادل،" الدليل لـ"كم يحتاج إلى بيعه للهروب من العجز والانتقال إلى الربح." أي مما يلي هو الصيغة الصحيحة لإيجاد كمية المبيعات التي هي نقطة التعادل؟`, answer: `قسمة إجمالي التكاليف الثابتة على مقدار سعر البيع لكل منتج واحد ناقص التكلفة المتغيرة لكل منتج واحد (الربح المتبقي لكل منتج واحد)` },
              { question: `بعد أشهر قليلة من الطرح للبيع، استقر الإيراد. بناءً على بيانات هذا الجدول، ما هي "كمية المبيعات عند نقطة التعادل" الحد الأدنى المطلوبة لاسترداد التكاليف الثابتة الشهرية بالكامل والانتقال إلى الربح؟`, answer: `٢٠٠ منتج` },
              { question: `تُقيّم بيانات كمية المبيعات الفعلية وتحلّل الحالة الراهنة للمشروع. بناءً على نقطة التعادل المُبيَّنة في هذا الجدول (٢٠٠ منتج)، تحكم هل كان كل شهر ربحًا أو عجزًا من كميات إيراد الشهر الماضي وهذا الشهر. أي مما يلي هو الأكثر ملاءمة؟`, answer: `بما أن الشهر الماضي كان فوق نقطة التعادل فهو "ربح،" وبما أن هذا الشهر كان تحتها فهو "عجز"` },
              { question: `مرّ نصف عام منذ بدء بيع المنتج، وبدأ الإيراد ينمو بثبات. على لوحة معلومات مركز بدء المشاريع، لتحليل أداء شركتك بشكل صحيح، يُعرَض الربح مقسّمًا إلى مراحل: "الربح الإجمالي ← الربح التشغيلي ← الربح الصافي." ما الهدف الأساسي من تقسيم والتحقق من الربح على مراحل، بدلًا من النظر إلى رقم واحد مُجمَّع؟`, answer: `لتحديد موقع المشكلة - "أي تكلفة هي سبب انخفاض الربح" - والقدرة على تحديد إجراءات تحسين إداري دقيقة وصحيحة` },
              { question: `بينما تقرأ جوهر الأرباح، تتأكد من أي نوع من الربح "الربح الإجمالي" من بين مراحل الربح. أيها مناسب؟`, answer: `الربح من طرح، من الإيراد، التكاليف المُنفَقة مباشرة على تصنيع المنتج نفسه أو تخزينه، كتكاليف المواد` },

              { question: `أي مما يلي أقرب إلى معنى PER (نسبة السعر إلى الربحية)؟`, answer: `رقم يمثّل كم مرة من ربحية السهم يمثّل سعر سهم الشركة` },
              { question: `بمقارنة الشركة أ والشركة ب في نفس الصناعة، كان ROE الشركة أ ١٨% وROE الشركة ب ٦%. أي مما يلي شيء مناسب يمكن قوله من هذا؟`, answer: `الشركة أ تكسب بكفاءة أكبر، لكن ما إذا كانت رخيصة لا يمكن معرفته من ROE وحدها` },
              { question: `PER شركة معينة أقل بكثير من متوسط الصناعة، وPBR أيضًا أقل من ١ مرة. في المقابل، حقق عملها ربحًا بثبات لسنوات عديدة. أي نوع من المستثمرين سيميل أكثر إلى اعتبار هذه الشركة مرشحة للشراء، ولماذا؟`, answer: `مستثمر استثمار قيمي. لأنه يركّز على إمكانية أن يكون سعر السهم الحالي مُتروكًا أرخص من القوة الحقيقية` },
              { question: `يفكر شخص، "لدي فقط حوالي ٢٠٠ جنيه شهريًا لتوجيهه للاستثمار، فحمله مُقسّمًا إلى عدة أجزاء مستحيل بالنسبة لي". أي مما يلي هو النصيحة الأنسب لهذا الشخص؟`, answer: `باستخدام صندوق استثماري، يمكنك صنع شكل من الحمل المُقسّم حتى بمبلغ صغير` },
              { question: `أي مما يلي أقرب كخاصية للصندوق المتداول في البورصة (ETF)؟`, answer: `قريب للصندوق الاستثماري، منتج قابل للتداول في السوق كالسهم بسعر اللحظة` },
              { question: `تحمل منتجًا مرتبطًا بمؤشر يحتوي على أسهم ٣٠ شركة رئيسية في دولة معينة. إذا تراجع أداء إحدى تلك الشركات وانخفض سعر سهم تلك الشركة فقط بشكل كبير، ماذا يحدث لسعر هذا المنتج من بين التالي؟`, answer: `حصة تلك الشركة الواحدة تعمل في اتجاه الانخفاض، لكن مجتمعة مع حركات الـ٢٩ شركة الأخرى، التأثير على المنتج بأكمله يسهل تقليله` },
              { question: `تقوم بالاستثمار بالتقسيط بـ٣٠٠ جنيه كل شهر. في يناير كان سعر المنتج ٣٠ جنيهًا للوحدة، وفي فبراير ١٥ جنيهًا للوحدة. أي مما يلي يفسّر بأفضل شكل تأثير طريقة الشراء هذه على مدى هذين الشهرين، مع مراعاة آلية الاستثمار بالتقسيط؟`, answer: `يمكنك شراء ٣٠ وحدة إجماليًا، ويصبح متوسط سعر الشراء للوحدة ٢٠ جنيهًا، أرخص من منتصف الأسعار البسيط. عمل شراء المزيد في الشهر الرخيص يقلل متوسط سعر الشراء` },
            ]
          },
          {
            title: `اختبار المعرفة: محاكاة حياة المستثمر - بناء الثروة للمستقبل`,
            questions: [
              { question: `من أجل شركتك الناشئة المستقبلية، قررت أولًا اكتساب، كفرد، القوة على تنمية المال. أي مما يلي يطابق بشكل صحيح "وسيلة فعّالة" لتنمية ٣٠٬٠٠٠ جنيه من الأموال الفائضة مع "تعريفها"؟`, answer: `الاستثمار: توقع عائد مستقبلي، وضع المال في نمو شركة أو مشروع، وتنميته بمرور الوقت` },
              { question: `تريد تنمية أموال فائضة على مدى طويل. من بين طرق استخدام المال الأربع التالية، أيّها الفعل الأنسب لهذا الهدف؟`, answer: `وضع مبلغ ثابت كل شهر لشركة تتوقع نموها حتى بعد ١٠ سنوات، الاستمرار في حمل السهم، وتنميته بمكاسب ارتفاع السعر وتوزيعات الأرباح` },
              { question: `أفادت أخبار اقتصادية مُعروضة على هولوغرام أن "الأسعار ترتفع في كل العالم"، وعُلِّق إشعار ارتفاع سعر في مقصف الغداء أيضًا. مع أنه لم تنخفض ورقة نقدية واحدة من حافظتك، لماذا تنخفض قيمتها "تنكمش" فقط من الاحتفاظ بها كما هي؟`, answer: `لأن حتى إذا بقي المبلغ نفسه، تنخفض كمية السلع والخدمات التي يمكنك شراءها بذلك المبلغ` },
              { question: `ارتفع سعر غداء المقصف المعتاد من ٨٠ جنيهًا للوجبة إلى ١٠٠ جنيه للوجبة. كيف يتغيّر عدد وجبات الغداء التي يمكنك شراءها بـ٤٬٠٠٠ جنيه المُخصَّصة للطعام؟`, answer: `العدد الذي يمكنك شراءه ينخفض بـ١٠، وحتى بنفس المبلغ، انكمشت الكمية التي يمكنك شراءها` },
              { question: `المبلغ المتوفر ٧٥٬٠٠٠ جنيه له ثلاث خطط. ٢٥٬٠٠٠ جنيه تكلفة دورة إعادة تعلّم يجب دفعها في نصف عام، ٢٠٬٠٠٠ جنيه نفقات معيشة قريبة المدى للانتقال في ٣ سنوات، والباقي ٣٠٬٠٠٠ جنيه لا خطة لاستخدامه في الوقت الحالي. أي مما يلي طريقة مناسبة للتعامل مع هذه المبالغ الثلاثة؟`, answer: `تأمين المبلغين ذوي وقت الاستخدام المحدد من خلال الادخار، وتحويل فقط الـ٣٠٬٠٠٠ جنيه غير المُستخدَمة في الوقت الحالي إلى استثمار` },
              { question: `بالنظر إلى مخطط الهولوغرام، تحرك سعر سهم شركة معينة بشكل كبير حتى خلال يوم واحد. أي مما يلي تفسير مناسب لـ"المخاطرة" في عالم التمويل، التي ستواجهها في الاستثمار المستقبلي؟`, answer: `يشير إلى مدى تقلب السعر، متحركًا في الاتجاهين، الزيادة والانخفاض` },
              { question: `في عمود محطة هولوغرام، تبحث عن علاقة "المخاطرة والعائد"، أساس اختيار الأهداف الاستثمارية. أي مما يلي تفسير مناسب يمثّل هاتين الطبيعتين؟`, answer: `هما في علاقة مقايضة حيث كلما زاد العائد المتوقع، كبرت المخاطرة المصاحبة أيضًا` },
              { question: `بينما تبحث عن مكان لإدارة أموال فائضة، ظهر إعلان يدّعي "رأس مال مضمون، ينمو بشكل موثوق وكبير كل شهر" بشكل متكرر. أي مما يلي طريقة مناسبة للتعامل مع هذا الإعلان في ضوء مبدأ المخاطرة والعائد؟`, answer: `اعتباره قصة تبدو جيدة أكثر من الحقيقة تخالف مقايضة المخاطرة والعائد، والشك فيها أولًا` },
              { question: `حملت الأخبار الاقتصادية الأحداث التالية ( ١ )-( ٤ ) التي حدثت في العالم. أي مما يلي يطابق بشكل صحيح الأحداث ( ١ )-( ٤ ) مع الأنواع الأربعة للمخاطر (مخاطر السوق، المخاطر الائتمانية، مخاطر السيولة، مخاطر سعر الصرف)؟ ( ١ ) تراجعت إدارة الهدف الاستثماري، ولم يعد المال المُقدَّم ( ٢ ) تغيّر سعر الصرف، وانخفضت قيمة أصل أجنبي محوَّل إلى العملة المحلية ( ٣ ) أدى تراجع اقتصادي عالمي إلى انخفاض أسعار أسهم شركات كثيرة بشكل عام ( ٤ ) أردت البيع لكن لم تجد مشتريًا، ولم تستطع تحويله إلى نقد تقريبًا`, answer: `( ١ ) المخاطر الائتمانية ( ٢ ) مخاطر سعر الصرف ( ٣ ) مخاطر السوق ( ٤ ) مخاطر السيولة` },
              { question: `تغيّر سعر الصرف من ١ دولار = ٤٨ جنيهًا إلى ١ دولار = ٥٢ جنيهًا. إذا كنت تحمل أصولًا بقيمة ٥٠٠ دولار لا يتغيّر سعرها المحلي، كيف تتغيّر قيمة هذا الأصل عند تحويله إلى الجنيه؟`, answer: `زادت بمقدار ٢٬٠٠٠ جنيه، وحتى بنفس السعر المحلي، تتحرك القيمة فقط من تغيّر سعر الصرف` },
              { question: `أنت تُوضّح قدرتك على تحمل المخاطر. ما تُخصّصه للإدارة هو أموال فائضة لا خطة لاستخدامها في الوقت الحالي، لكنك قد تستخدم جزءًا منها في غضون سنوات قليلة. أيضًا، أنت من النوع الذي، عندما تنخفض الأصول بشكل كبير مؤقتًا، يهتم حتى في الليل ولا يستطيع الاستقرار. أي مما يلي طريقة مناسبة للتفكير في القدرة على تحمل المخاطر في هذه الحالة؟`, answer: `بما أن لديك مجالًا لكن قد تستخدم جزءًا في غضون سنوات قليلة وتتحمّل انخفاضات السعر بشكل ضعيف أيضًا، تحديد مدى التقلب المقبول عند المستوى المتوسط` },
              { question: `بحثت عن "السهم" و"السند"، الأهداف الاستثمارية الرئيسية للأموال الفائضة، في مقال هولوغرام. أي مما يلي تفسير مناسب للفرق بين هذين الاثنين؟`, answer: `السهم حصة شركة ذو تحرك سعري كبير نوعًا ما، والسند يميل إلى تحرك سعري صغير بسبب وجود وعد بالسداد` },
              { question: `تريد السعي إلى دخل شهري منتظم وارتفاع سعر طويل المدى معًا. ليس لديك خطة للبيع في الوقت الحالي، ولا يهمك عدم القدرة على التحويل إلى نقد فورًا. أي مما يلي من الأهداف الاستثمارية يناسب هذه الرغبة بأفضل شكل؟`, answer: `العقارات` },
              { question: `بينما توسّع مرشحي أهدافك الاستثمارية، لاحظت "الذهب"، الذي يختلف تحركه السعري عن الأسهم والسندات. أي مما يلي تفسير مناسب للذهب، الذي تختلف خصائصه عن الأسهم والسندات؟`, answer: `لا يُنتج عائدًا، لكنه يميل إلى جذب الانتباه كمخزن للقيمة في أوقات ارتفاع الأسعار أو عدم الاستقرار` },
              { question: `بأموال فائضة لا خطة لاستخدامها في الوقت الحالي، أنت على وشك بدء إدارتها. قد يحدث أنه فورًا بعد البدء، ينخفض السوق بأكمله وتنكمش أصولك مؤقتًا بحوالي ١٠%، ويقول من حولك "من الأفضل أن تبيع الآن". أي مما يلي سياسة مناسبة لتنمية هذه الأموال بجعل الوقت حليفًا في مشهد كهذا؟`, answer: `بما أن الأموال لن تُستخدَم في الوقت الحالي، عدم الانجراف مع انخفاضات السعر القريبة المدى أو أصوات من حولك، والاستمرار في حمل هدف استثماري متوقع أن ينمو` },
              { question: `قررت قدرة على تحمل المخاطر بـ"قد تستخدم جزءًا في غضون سنوات قليلة، وتريد تجنب انخفاضات السعر الكبيرة". هناك، سهم ارتفع سعره ثلاث مرات في نصف العام الماضي ويُشتهَر أنه سيستمر في الارتفاع، وهو موضوع رائج. تحركه السعري حاد جدًا، ولا يمكنك بالضرورة البيع فورًا عندما تريد. أي مما يلي طريقة مناسبة للتعامل مع هذا السهم؟`, answer: `التحقق من آفاق النمو، وحجم التحرك السعري، وما إذا كان يمكن بيعه فورًا مقابل القدرة المُحدَّدة، والتنازل عن الشراء إذا لم تتناسب` },
              { question: `قبل شراء سهم لأول مرة، تعيد التحقق عبر محطة الهولوغرام من ماهية السهم أساسًا. أي مما يلي تفسير مناسب للسهم؟`, answer: `ورقة مالية تُصدرها شركة لجمع أموال لأنشطتها، تمثّل حصة شركة` },
              { question: `من خلال التقديم، فُتِح حساب أوراق مالية. عندما تضع أمر شراء سهم من حساب الأوراق المالية، تُبرم الصفقة دون أن تبحث عن طرف مقابل بنفسك، ويتحدد سعر السهم وفقًا لتلاقي أوامر البيع والشراء. أي مما يلي تفسير مناسب لدور البورصة الذي يدعم هذا؟`, answer: `تجمع أوامر بائعي ومشتري الأسهم في مكان واحد، ويتحدد سعر السهم حيث تتلاقى رغبات المشترين والبائعين` },
              { question: `المال المُحصَّل من الاستثمار في الأسهم له شكلان -توزيعات الأرباح (مكسب الدخل) والمكسب الرأسمالي. أي مما يلي تفسير مناسب للفرق بين هذين الاثنين؟`, answer: `توزيعات الأرباح (مكسب الدخل) مال توزّعه شركة على المساهمين من جزء من صافي الربح الذي كسبته، والمكسب الرأسمالي هو ربح الفرق من بيع السهم بسعر أعلى من سعر الشراء` },
              { question: `إذا شريت وبعت سهمًا بالضبط كما في هذا الجدول، أي مما يلي مكسب رأسمالي (مكسب ارتفاع السعر) مناسب تم الحصول عليه؟`, answer: `٦٠٠ جنيه، وفقط الفرق بين سعر البيع وسعر الشراء مضروبًا في عدد الأسهم يصبح ربحًا` },
              { question: `بالنظر إلى صفحة شركة أنت على وشك شراء سهم فيها، مقدار توزيعات الأرباح لكل سهم زاد وانخفض عامًا بعد عام. أي مما يلي سبب مناسب لتغيّر مقدار توزيعات الأرباح عامًا بعد عام بهذا الشكل؟`, answer: `لأن مصدر توزيعات الأرباح (مكسب الدخل) هو صافي الربح الذي حققته الشركة، والمبلغ القابل للتوزيع يتغيّر بحسب أداء تلك السنة` },
              { question: `أعلنت شركة الهدف الاستثماري، "هذه السنة لن ندفع توزيعات أرباح، وسنخصص هذا الجزء بدلًا من ذلك لبناء مصنع جديد (إعادة استثمار)"، وانخفض سعر السهم قليلًا أيضًا فورًا بعد الإعلان. أي مما يلي طريقة مناسبة لأخذ هذا كمساهم؟`, answer: `أخذها كخيار لإعادة استثمار صافي الربح في النمو، والحكم على المدى الطويل فيما إذا كانت قيمة الشركة تنمو` },
              { question: `سعر السهم الذي تحمله يرتفع وينخفض يوميًا. أي مما يلي تفسير مناسب للآلية الأساسية التي يتحرك بها سعر السهم أساسًا؟`, answer: `تغيّر توازن الأشخاص الذين يريدون الشراء والأشخاص الذين يريدون البيع يجعل سعر السهم يرتفع وينخفض` },
              { question: `شركة حلويات معينة موضوع كبير على مواقع التواصل الاجتماعي، لكن بالنظر إلى أدائها، لا يظهر نمو كبير في الإيرادات أو الربح بعد. أي مما يلي طريقة مناسبة للتفكير فيما إذا كنت تشتري المزيد من هذا السهم؟`, answer: `رغم أن الشعبية يمكن أن ترفع سعر السهم، الحكم بعد التحقق من دعم الأداء` },
              { question: `في يوم أفادت فيه الأخبار أن "معدل البطالة تراجع"، رغم أن شركة هدفك الاستثماري لم تُعلن شيئًا، انخفض سعر سهمها. أي مما يلي تفسير مناسب لعامل انخفاض السعر في هذا اليوم؟`, answer: `مؤشر اقتصادي كمعدل البطالة نشر قلقًا حول الآفاق الاقتصادية، وزاد الأشخاص الذين يريدون بيع الأسهم عبر السوق بأكمله` },
              { question: `أفادت الأخبار أن "أسعار أسهم شركات كثيرة ترتفع بزخم يتجاوز نمو ربحها بشكل كبير". أي مما يلي تفسير مناسب عندما يكون السوق بأكمله في حالة كهذه؟`, answer: `حالة يرتفع فيها سعر السهم على التوقع أو الشعبية وحدها بما يتجاوز الواقع، وعندما ينتشر الحذر يمكن أن ينهار من تدفق البيع` },
              { question: `سهم يستمر في التصاعد موضوع في العمل أيضًا. عندما تتردد بين شراء هذا السهم بجزء من أموالك الفائضة طويلة المدى، أي مما يلي طريقة مناسبة للتفكير بحيث لا يتذبذب حكمك؟`, answer: `فحص جوهر التصاعد مقابل الأداء، وإذا كان ارتفاعًا على التوقع وحده، التنازل عن الشراء بالأموال الفائضة` },
              { question: `وصلت دعوة للجمعية العامة للمساهمين من هدفك الاستثماري. عندما تحضر كمساهم، أي مما يلي تفسير مناسب لما يمكنك فعله هناك؟`, answer: `يمكنك إظهار الموافقة أو عدم الموافقة على قرارات الشركة المهمة باستخدام حقوق التصويت التي تملكها` },
              { question: `عندما حاولت شراء سهم في شركة مصنّعة لمعدات كرة القدم مهتم بها، لم تكن تلك الشركة قد خرجت للسوق بعد ولم يمكن تداولها. ما المطلوب لكي يصبح سهم هذه الشركة قابلًا للتداول في السوق من أي شخص؟`, answer: `قيام الشركة بتجاوز فحص البورصة، والطرح للتداول، وفتح وعرض سهمها للسوق` },
              { question: `في أعلى شاشة محطة الهولوغرام، يُعرَض دائمًا رقم يُسمّى "المؤشر السهمي". أي مما يلي تفسير مناسب لما يمثّله هذا الرقم، الذي يتحرك بشكل منفصل عن أسعار أسهم الشركات الفردية؟`, answer: `رقم يُجمّع ويحسب، بطريقة فريدة، أسعار أسهم شركات متعددة تمثّل السوق` },
              { question: `تُحاكي سوقًا صغيرًا مكوّنًا من ثلاث شركات فقط، كهذا الجدول. بالأمس كان متوسط الثلاث شركات ١٠٠ جنيه، واليوم فقط الشركة ب ارتفعت ٦٠ جنيهًا في السعر بينما الشركتان الأخريان دون تغيير. أي مما يلي يذكر بشكل صحيح متوسط سعر السهم لليوم للثلاث شركات وطبيعة المؤشر؟`, answer: `١٢٠ جنيهًا، وارتفاع الشركة ب البالغ ٦٠ جنيهًا يصبح ارتفاعًا بـ٢٠ جنيهًا في متوسط الثلاث شركات` },
              { question: `في صباح ما، انخفض المؤشر السهمي بشكل كبير عن اليوم السابق. سعر سهم هدفك الاستثماري لم ينخفض تقريبًا، وأداؤه سلس أيضًا. أي مما يلي رد مناسب في هذا الوضع؟`, answer: `بما أن المؤشر مقياس السوق بأكمله، التحقق من السهم المحمول وحالة الشركة، ثم النظر فيما إذا كنت تبيع أو تستمر في حمل ذلك السهم` },
              { question: `بالنظر إلى سجل استثمارك للسنة الماضية، تحدَّدت زيادة وانخفاض الأصول كلها بتحرك سعر شركة هدف استثماري واحدة فقط. أي مما يلي طريقة مناسبة للتفكير نحو بناء أصول مستقبلي مستقر؟`, answer: `بما أن البقاء مُركَّزًا في شركة واحدة يترك كل الأصول متأثرة بتحرك سعر شركة واحدة، اعتمد التنويع بتقسيم أموالك على عدة أهداف استثمارية` },
              { question: `قررت تبنّي طريقة "التنويع" بشكل كامل في بناء أصولك المستقبلي. أي مما يلي تفسير مناسب للتنويع؟`, answer: `تقسيم الأهداف الاستثمارية إلى عدة أجزاء، بحيث حتى إذا انخفض سعر هدف استثماري واحد، يمكن للأخرى دعمه` },
              { question: `أي مما يلي هو مزيج مناسب للأمثلة الملموسة التالية ①-③ في التنويع والمحاور الثلاثة (فئة الأصل، المنطقة، الزمن)؟ ① شراء نفس الهدف الاستثماري بمبالغ صغيرة على فترات منتظمة، ليس دفعة واحدة بل بتقسيم فترة الشراء إلى كل شهر ② حمل أموال مُقسّمة إلى أهداف استثمارية ذات طبائع مختلفة، كالأسهم والسندات والذهب ③ حمل شركات للاستثمار فيها مُقسّمة إلى شركات محلية وخارجية`, answer: `① الزمن ② فئة الأصل ③ المنطقة` },
              { question: `بنيت محفظة إجماليها ٣٠٬٠٠٠ جنيه. حددت دليلًا لـ"حتى نصف (٥٠%) الكل" للتسليم للأسهم ذات التحرك السعري الكبير. أي مما يلي تفسير مناسب للعلاقة بين نسبة الأسهم الحالية والدليل المُحدَّد؟`, answer: `ضمن دليل النصف، لكن الأسهم تحتل قريبًا من النصف` },
              { question: `بمطابقة كل يوم راتب شهري، تبدأ "الاستثمار بالتقسيط"، مضيفًا مبلغًا ثابتًا. أي مما يلي تفسير مناسب لآلية هذا الاستثمار بالتقسيط؟`, answer: `الاستمرار في شراء نفس الهدف الاستثماري بمبلغ ثابت في توقيت ثابت، وتشتري قليلًا عندما يكون مرتفعًا وكثيرًا عندما يكون رخيصًا` },
              { question: `شريت نفس السهم بـ٣٬٠٠٠ جنيه في كل مرة، مُقسّمًا على مرتين. المرة الأولى كانت بسعر ١٠٠ جنيه للسهم، والثانية بسعر ٣٠٠ جنيه للسهم. أي مما يلي يحسب بشكل صحيح متوسط سعر الشراء الإجمالي لكل سهم وتأثير التقسيط بمبلغ ثابت؟`, answer: `١٥٠ جنيهًا، مُحافَظًا عليه أقل من الوسط البسيط بمقدار ما استطعت شراءه أكثر عندما كان رخيصًا` },
              { question: `تعلمت المحاور الثلاثة للتنويع (فئة الأصل، المنطقة، الزمن) وقدرتك على تحمل المخاطر (قد تستخدم جزءًا في غضون سنوات قليلة، وتريد تجنب انخفاضات السعر الكبيرة). مع ذلك، كنتيجة للشراء حتى الآن، الآن معظم أصولك مُنحازة لسهم شركة معينة واحدة. أي مما يلي طريقة مناسبة لبناء مزيج (محفظة) يناسبك من هنا؟`, answer: `التقسيم بالمحاور الثلاثة لفئة الأصل والمنطقة والزمن، والبناء بحيث يتناسب مع القدرة على تحمل المخاطر، مخفّفًا الانحياز نحو شركة واحدة` },
              { question: `من بين المعلومات التالية ①-④ لتقييم شركة هدف استثماري، أي مما يلي يحدد بشكل صحيح كل معلومة كـ"كمية" أو "نوعية"؟ ① عدد المحلات الجديدة المفتوحة هذا العام، المُعلَن من الشركة ② طريقة تفكير المدير في مستقبل الشركة، كما ذُكِرت ③ سهولة استخدام المنتجات وحالة الموظفين، المُلاحَظة بزيارة محل ④ قيمة ROE (العائد على حقوق الملكية) المُدرَجة في المواد`, answer: `① كمية ② نوعية ③ نوعية ④ كمية` },
              { question: `بالبحث عن شركة لاحظتها على محطة الهولوغرام، هناك شركة سعر سهمها ١٦٠ جنيهًا للسهم وربحية سهمها ٨ جنيهات. أي مما يلي يحسب بشكل صحيح PER (نسبة السعر إلى الربحية) للشركة ويفسّر معناها؟`, answer: `PER هو ٢٠ مرة، وسعر السهم عند مستوى ما يعادل ٢٠ سنة من ربحية السهم` },
              { question: `وسط متوسط PER للصناعة البالغ ١٨ مرة، وجدت شركة بـ PER يبلغ ٩ مرات. أي مما يلي معنى مناسب لكون PER أقل من متوسط الصناعة بهذا الشكل؟`, answer: `حالة يكون فيها سعر السهم منخفضًا نسبيًا مقارنةً بربحيته، ما قد يشير إلى انخفاض تقييمه` },
              { question: `تُقارن شركتين مرشحتين لمحفظتك في هذا الجدول. أي مما يلي يحدد بشكل صحيح الشركة ذات سعر السهم الأرخص نسبيًا نسبة إلى صافي الأصول، والشركة التي تكسب بكفاءة باستخدام رأس مالها؟`, answer: `الأرخص = الشركة أ، الأكثر كفاءة في الكسب = الشركة ب` },
              { question: `بالنظر إلى قائمة الأسهم على محطة الهولوغرام، لاحظت شركة PER منخفض بشكل خاص عن متوسط الصناعة. لكن هناك أيضًا معلومة أن إيرادات منتج هذه الشركة الرئيسي تراجعت حديثًا. أي مما يلي طريقة مناسبة للتفكير بحيث لا يتذبذب حكمك حول شراء سهم هذه الشركة؟`, answer: `التحقق من سبب انخفاض PER والإيرادات والأداء، وتمييز ما إذا كان سعر السهم رخيصًا حقًا نسبة إلى الربح والأصول` },
              { question: `وجدت واستثمرت في شركة سعر سهمها منخفض مقارنةً بقوتها الحقيقية، رغم أن أرباحها مستقرة. أي مما يلي يطابق بشكل صحيح اسم هذا الأسلوب الاستثماري مع وصفه؟`, answer: `الاستثمار القيمي: البحث عن واختيار شركة سعر سهمها منخفض مقارنةً بقوتها الحقيقية` },
              { question: `بعد اكتساب طريقة تفكير التنويع والقوة على تمييز الشركات، بإضافة "الصندوق الاستثماري" أخيرًا إلى الخيارات أيضًا، أكملت محفظة يمكن تسميتها الأفضل لك. أي مما يلي تفسير مناسب لهذا الصندوق الاستثماري؟`, answer: `منتج يستثمر فيه متخصص مالًا مُجمَّعًا من أشخاص كثيرين، مُنوَّعًا في أسهم وسندات وما شابه` },
              { question: `بعد اكتساب طريقة الاختيار بالبحث الشامل وطريقة الربط بالسوق بأكمله معًا، مرّت عدة سنوات منذ بنيت محفظة يمكن تسميتها الأفضل لك. أي مما يلي طريقة مناسبة لدمج الطرق لصنع شكل سهل الاستمرار في بناء أصول مستقر طويل المدى من هنا أيضًا؟`, answer: `التركيز على التقسيط في الاستثمار في المؤشر الذي يربط بحركة السوق بأكمله، ودمج جزئيًا سهم شركات مُميَّزة كرخيصة` },
              { question: `نمت الـ٣٠٬٠٠٠ جنيه المُخصَّصة للإدارة إلى ٤٢٬٠٠٠ جنيه على مدى سنوات قليلة. أي مما يلي يحسب بشكل صحيح "معدل النمو" من المبلغ الأولي ويفسّر معناه؟`, answer: `زيادة ٤٠%، تُظهر أن ١٢٬٠٠٠ جنيه زادت على الـ٣٠٬٠٠٠ جنيه الأولية` },
              { question: `الأسهم والسندات والذهب التي حملتها مُقسّمة نمت كما في هذا الجدول على مدى سنوات قليلة. أي مما يلي استنتاج دقيق يمكنك استخلاصه من الفرق في كيفية نمو الأصول الثلاثة؟`, answer: `كلما كبر التحرك السعري للأسهم، كلما نمت أكثر، وتظهر علاقة المخاطرة والعائد في النتيجة` },
              { question: `انتهت تجربة المحاكي، واكتسبت القوة على تنمية ٣٠٬٠٠٠ جنيه من الأموال إلى ٤٢٬٠٠٠ جنيه. وفي العالم الحقيقي مستقبلًا أيضًا، في كل مرة يتغيّر هدفك أو وضعك، ستُعيد التأكد من ( ١ )، وبمبدأ ( ٢ ) الذي تعلمته، ستُنمّي الأموال بينما تُرتّب المزيج. أي مما يلي زوج كلمات يملأ الفراغين ( ١ ) و( ٢ ) بأفضل شكل؟`, answer: `( ١ ) القدرة على تحمل المخاطر ( ٢ ) الاستمرار طويل المدى، والتنويع، والتقسيط، ورؤية الأرقام كالأداء ومحتوى الأعمال معًا` },
            ]
          }]

      {
        title: `الذكاء الاصطناعي والتمويل ومستقبل الأعمال`,
        sections: [
        {

          lessons: [
          {
            title: `شركات الذكاء الاصطناعي ونماذج الأعمال`,
            questions: [
              { question: `يستخدم متجر معيّن الذكاء الاصطناعي لكي يقدّر "كم قطعة من هذا المنتج يُحتمل بيعها الشهر القادم" بناءً على بيانات مثل المبيعات السابقة والأحوال الجوية. أي من وظائف الذكاء الاصطناعي الآتية يتوافق مع هذا؟`, answer: `"التنبؤ"، بالتقدير المسبق من بيانات الماضي` },
              { question: `قررت أن تستخدم خدمة محادثة ذكاء اصطناعي توليدي لتعمل مسودة بداية لعرض عمل لشريك تجاري. لديك اسم الشريك، ومعلومات عن منتج شركتك الجديد الذي لم يُعلن عنه بعد، وإحصائيات من شركات أخرى تريد أن ترجع إليها. أي من الآتي أفضل طريقة لاستخدام خدمة المحادثة هذه؟`, answer: `عدم إدخال المعلومات التي لم تُعلن بعد أو اسم الشريك، والتأكد بنفسك هل المحتوى الناتج مطابق للحقائق قبل الاستخدام` },
              { question: `شريت أشياء تريدها عدة مرات خلال شهر واحد باستخدام الدفع اللاحق (BNPL) في التسوّق عبر الإنترنت. وقت الشراء، لم ينقص المال الذي في يدك فاستخدمته بخفّة، لكن في نهاية الشهر، تجمعت مواعيد هذه الدفعات في الفترة نفسها التي تستحق فيها مدفوعات عادية مثل الإيجار. أي من الآتي يفسّر بشكل أفضل هذا الموقف؟`, answer: `الدفع اللاحق فقط يؤجّل الدفع والسعر لا يختفي، فكلما استخدمته أكثر، كلما زاد إجمالي الدفع المستقبلي` },
              { question: `مع انتشار الفينتك (دمج التمويل والتكنولوجيا) في المجتمع، الخدمات المرتبطة بالفلوس تغيّرت بشكل كبير. أي من الآتي يصف بدقة أكبر التغيّرات التي أحدثتها التكنولوجيا المالية وطريقة تعامل المستخدمين معها؟`, answer: `تقدمت راحة الاستخدام على مدار الساعة والتخصيص المناسب لكل فرد، لكن المسؤولية عن التأكد من محتوى العقد بنفسك لم تتغيّر` },
              { question: `عندما جرّب شخص أن يشتري هاتفًا بالتقسيط وقدّم طلبًا في المحل، تم على الفور تأكيد بـ"تقييم الجدارة الائتمانية". تمت مراجعة بيانات مثل تاريخ الدفع السابق، وتم الحكم هل يمكن قبول طلب التقسيط. أي من الآتي يفسّر بشكل أفضل الدور الذي يلعبه تقييم الجدارة الائتمانية هنا؟`, answer: `تحديد، من خلال بيانات مثل تاريخ الدفع السابق، ما إذا كانوا قادرين على دفع أقساطهم في موعدها` },
              { question: `أثناء رحلة، قمت بعملية شراء أكبر من المعتاد في متجر غير مألوف لك. بعد ذلك فورًا، وصلت رسالة من شركة البطاقة تتأكد، "هل الاستخدام الآن كان بواسطتك؟" أي من الآتي يفسّر بشكل أفضل الآلية التي وصلت بها هذه الرسالة؟`, answer: `اكتشف الذكاء الاصطناعي معاملة غير معتادة وأطلق تنبيهًا، ثم استُخدم التنبيه كإشارة ليتأكد الشخص مما إذا كان هو من أجرى المعاملة فعلًا` },
              { question: `تحاول شركة ناشئة معيّنة في الذكاء الاصطناعي أن تعمل "خدمة يستطيع فيها موظفو الشركة أن يتأكدوا بسرعة من النقاط التي يجب أن ينتبهوا لها في عقد"، بربط ذكاء اصطناعي لتوليد النص موجود. أي من الآتي أفضل طريقة لتحقيق "قيمة فريدة" من خلال هذه الخدمة؟`, answer: `تنشأ قيمة فريدة من خلال دمج، مع الذكاء الاصطناعي الموجود، معلومات عن النقاط التي غالبًا تصبح مشكلة في العقود وتصميم شاشة (واجهة مستخدم) سهلة الفحص للموظفين` },
              { question: `شركة ناشئة معيّنة في الذكاء الاصطناعي أطلقت خدمتها في صورة "SaaS (البرمجيات كخدمة)"، تُستخدم باستمرار عن طريق الإنترنت. أي من الآتي يقدم أفضل تصور لتشغيل وتكاليف خدمة الذكاء الاصطناعي من نوع SaaS؟`, answer: `كلما زاد استخدام المستخدمين للذكاء الاصطناعي، زادت التكاليف الحسابية الخفية (مثل رسوم الخوادم)، فخطة تسعير تأخذ في الاعتبار توازن التكاليف والدخل تصبح ضرورية` },
              { question: `شركة معيّنة تفكر في كيفية الاستفادة مستقبلًا من البيانات المتعلقة بكيفية استخدام المستخدمين لخدمة الذكاء الاصطناعي الخاصة بها، والتي جُمعت أثناء تشغيلها. أي من الآتي أفضل منظور لما تتقدم في عمل "تحقيق قيمة اقتصادية من البيانات"؟`, answer: `إدارة البيانات بأمان، وشرح هدف الاستخدام بوضوح للمستخدمين، وبعد ذلك ربطها بتحسينات الخدمة ودخل عمل جديد` },
              { question: `لأول استثمار له، اختار شخص كما هي الخطة التي اقترحها مستشار آلي (ذكاء اصطناعي) على أنها تناسبه. لكن بعد فترة، انخفض سعر الاستثمار وحدثت خسارة. أي من الآتي أفضل طريقة لتفسير هذه النتيجة؟`, answer: `الذكاء الاصطناعي خدمة مريحة تساعد في إجراءات وحكم الاستثمار، لكن ما دام الأمر يتعلق باستثمار، فإن مسؤولية الاختيار النهائي ومخاطر الخسارة الناتجة عن انخفاض السعر تقع عليك أنت` },
            ]
          },
          {
            title: `تأثير الذكاء الاصطناعي والثقافة الرقمية`,
            questions: [
              { question: `شخص بدأ يبيع إكسسوارات يدوية الصنع أونلاين بيفكر يدمج الذكاء الاصطناعي في شغله. أي من الآتي أفضل طريقة للاستفادة من نقاط قوة الذكاء الاصطناعي ونقاط قوة البشر؟`, answer: `سيب تحليل بيانات المبيعات للذكاء الاصطناعي، والتفكير في تصاميم ورسائل جديدة للعملاء بنفسه` },
              { question: `رأى صاحب مخبز تنبؤ طلب من أداة ذكاء اصطناعي واشترى دقيقًا زائدًا، لكن التنبؤ أخطأ، وبقيت كمية كبيرة من الدقيق فائضة. أي من الآتي أفضل منظور على "المساءلة"؟`, answer: `بما أنه هو نفسه الذي تبنّى التنبؤ وقرر، التفكير بأن مسؤولية النتيجة عليه، والاستفادة منها في الحكم القادم` },
              { question: `عندما طبقت مدرسة معينة آلية لتصحيح مقالات الطلاب باستخدام الذكاء الاصطناعي، تبيّن أن الطلاب الذين كتبوا بأسلوب ثابت فقط حصلوا على درجات عالية، وكانت درجات الطلاب الآخرين منخفضة. أي من الآتي يفسّر بشكل أفضل هذا الموقف؟`, answer: `من المتصوَّر أن المقالات التي حصلت على درجات عالية في الماضي كانت تتسم بخصائص متشابهة، وأن وجود أو غياب هذه الخصائص أثّر على الدرجات، فتتحمل المدرسة المسؤولية وتحسّن طريقة التصحيح` },
              { question: `لما خليت الذكاء الاصطناعي يبحث حدث تاريخي لتقرير، ظهرت إجابة منطقية، ومفصلة حتى في التواريخ وأعداد الأشخاص. أي من الآتي أفضل طريقة للتعامل مع هذه المعلومة؟`, answer: `بما أن المحتوى لا يكون بالضرورة صحيحًا، استخدامها بعد التأكد أيضًا بمصدر آخر مثل كتاب مدرسي أو موقع رسمي` },
              { question: `شفت منشور على سوشيال ميديا يقول "شركة مشهورة قريبًا هتفلس". انتشر المنشور على نطاق واسع وأصبح موضوعًا رائجًا. أي من الآتي أفضل إجراء تاخده، مع مراعاة احتمالية إنها أخبار كاذبة؟`, answer: `بما أنك لا تعرف هل هي صحيحة، لا تصدّقها بتهور إلى أن تتأكد بالإعلان الرسمي للشركة أو مقال إخباري كبير موثوق` },
              { question: `أنت على وشك استخدام الذكاء الاصطناعي للمساعدة في التخطيط لرحلة مع أصدقائك. أي من الآتي أفضل طريقة للتعامل مع المعلومات التي تُدخلها في الذكاء الاصطناعي؟`, answer: `ليقدّم أفكارًا لأكل تأكله في الوجهة، أدخل فقط معلومات لا ترتبط بأفراد، مثل اسم الوجهة والبرنامج الزمني` },
              { question: `شركة معيّنة بتفكر تسيب جزء من شغلها للذكاء الاصطناعي. أي من الأعمال التالية يجب أن يواصل البشر توليها بدلًا من الذكاء الاصطناعي؟`, answer: `الاستماع بعناية إلى عميل مر بتجربة مؤلمة، والتفكير في رد يراعي مشاعره` },
              { question: `شخص معيّن كان بيعمل شغل صنع مواد إدارية، بناءً على نتائج استبيانات داخلية مختلفة. مع تغيّرات العصر، بدأ يعمل على "إعادة صقل المهارات"، من خلال تعلم تقنية جديدة وتطوير قيمته المهنية. أي من الآتي أنسب مسار لإعادة صقل المهارات؟`, answer: `التفكير "لأستفد من القوى التي طوّرتها حتى الآن كأساس"، وتعلّم مهارات جديدة لاستخدام الذكاء الاصطناعي بشكل مناسب لرفع الإنتاجية، وهدفه ضربهما مع بعض` },
              { question: `شخص ماهر في الطبخ، هدفه أن يصبح مستقلًا ويفتح مطعمه الخاص في المستقبل، يفكر في أن يبني "محفظة مهاراته" استعدادًا لتغيّرات العصر القادمة. أي من الآتي يقدم أفضل تصور؟`, answer: `مع تعميق مهاراته في الطبخ، يتعلم أيضًا تدريجيًا مهارات مرتبطة بالإدارة، مثل "إدارة المال" و"النشر على وسائل التواصل الاجتماعي"` },
              { question: `بدأ شخص معيّن "محل وجبات معلّبة يهتم بخضروات موسمية محلية" لدعم المزارعين المحليين. لكنه يواجه مشاكل إدارية بأن "عدد العملاء لا يمكن قراءته يومًا بيوم، ويوجد كثير من التخلص من وجبات لم تُبع" و"تكاليف الشراء عالية، ولو خفّف حذره يدخل في العجز فورًا". أي من الآتي أنسب إجراء لتحقيق هدف "حماية خصوصية المحل مع تقليل هدر الطعام وخطر العجز لجعل المشروع مستدامًا"؟`, answer: `بناءً على بيانات عدد العملاء السابقة وبيانات الأحوال الجوية، جعل الذكاء الاصطناعي يحسب تنبؤ الطلب للأسبوع القادم، والرجوع إلى هذه الأرقام لتحديد كمية شراء الخضروات المحلية وسعر بيع الوجبات بحكمه الخاص مع تعديلات دقيقة` },
            ]
          }]
        }, ]
      }]
    };
  </script>
  
  <script>
    (function() {
      "use strict";
      var app = document.getElementById("app"),
        DATA, INDEX = [],
        lastQuery = "";
      
      try { DATA = CONTENT }
      catch (e) { app.innerHTML = '<p class="note">فيه خطأ في بيانات الموقع (راجع الفواصل والأقواس وعلامات ` ).</p>'; return }
      
      function norm(s) { return String(s || "").toLowerCase().replace(/[\u064B-\u065F\u0670\u0640]/g, "").replace(/[أإآ]/g, "ا").replace(/ى/g, "ي").replace(/ة/g, "ه").replace(/\s+/g, " ").trim() }
      
      function el(t, c, x) { var e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e }
      
      function linkBtn(href, title, sub) {
        var a = el("a", "btn");
        a.href = href;
        var t = el("span");
        t.appendChild(document.createTextNode(title));
        if (sub) t.appendChild(el("span", "sub", sub));
        a.appendChild(t);
        a.appendChild(el("span", "arrow", "←"));
        return a
      }
      
      function backBtn(href, label) {
        var a = el("a", "back", "→ " + label);
        a.href = href;
        return a
      }
      
      function clear() {
        app.innerHTML = "";
        window.scrollTo(0, 0)
      }
      
      function buildIndex() {
        (DATA.chapters || []).forEach(function(ch, ci) {
          INDEX.push({ kind: "فصل", title: ch.title, sub: "", text: norm(ch.title), href: "#/c/" + ci });
          (ch.sections || []).forEach(function(sec, si) {
            (sec.lessons || []).forEach(function(ls, li) {
              var base = "#/l/" + ci + "/" + si + "/" + li;
              INDEX.push({ kind: "درس", title: ls.title, sub: ch.title + " ‹ " + sec.title, text: norm(ls.title), href: base });
              (ls.questions || []).forEach(function(q, qi) {
                INDEX.push({ kind: "سؤال", title: q.question, sub: ls.title, text: norm(q.question + " " + q.answer), href: base + "/" + qi });
              });
            });
          });
        });
      }
      
      function renderHome() {
        clear();
        app.appendChild(el("h1", null, DATA.siteTitle || "إجابات المنصة التعليمية"));
        app.appendChild(el("p", "lead", DATA.subtitle || ""));
        var input = el("input", "search");
        input.type = "search";
        input.placeholder = "ابحث عن فصل أو درس أو سؤال";
        input.setAttribute("aria-label", "بحث");
        input.value = lastQuery;
        app.appendChild(input);
        var out = el("div", "list");
        app.appendChild(out);
        
        function draw() {
          lastQuery = input.value;
          out.innerHTML = "";
          var q = norm(input.value);
          if (!q) {
            (DATA.chapters || []).forEach(function(ch, ci) { out.appendChild(linkBtn("#/c/" + ci, ch.title)) });
            if (!(DATA.chapters || []).length) out.appendChild(el("p", "note", "الإجابات لسه مش متاحة"));
            return;
          }
          var words = q.split(" ");
          var hits = INDEX.filter(function(it) { return words.every(function(w) { return it.text.indexOf(w) !== -1 }) });
          if (!hits.length) { out.appendChild(el("p", "note", "مفيش نتائج، جرّب كلمة تانية")); return }
          hits.slice(0, 60).forEach(function(it) {
            var t = it.title.length > 140 ? it.title.slice(0, 140) + "…" : it.title;
            out.appendChild(linkBtn(it.href, t, it.kind + (it.sub ? " • " + it.sub : "")));
          });
        }
        input.addEventListener("input", draw);
        draw();
      }
      
      function renderChapter(ci) {
        var ch = (DATA.chapters || [])[ci];
        if (!ch) return renderHome();
        clear();
        app.appendChild(backBtn("#/", "رجوع"));
        app.appendChild(el("h1", null, ch.title));
        var secs = ch.sections || [];
        if (!secs.length) { app.appendChild(el("p", "note", "الإجابات لسه مش متاحة")); return }
        secs.forEach(function(sec, si) {
          app.appendChild(el("h2", null, sec.title));
          var list = el("div", "list");
          (sec.lessons || []).forEach(function(ls, li) { list.appendChild(linkBtn("#/l/" + ci + "/" + si + "/" + li, ls.title)) });
          if (!(sec.lessons || []).length) list.appendChild(el("p", "note", "الإجابات لسه مش متاحة"));
          app.appendChild(list);
        });
      }
      
      function addImage(p, src, alt) {
        if (!src) return;
        var i = document.createElement("img");
        i.src = src;
        i.alt = alt;
        i.loading = "lazy";
        p.appendChild(i)
      }
      
      function renderLesson(ci, si, li, target) {
        var ch = (DATA.chapters || [])[ci],
          sec = ch && (ch.sections || [])[si],
          ls = sec && (sec.lessons || [])[li];
        if (!ls) return renderHome();
        clear();
        app.appendChild(backBtn("#/c/" + ci, "رجوع إلى " + ch.title));
        app.appendChild(el("p", "crumb", sec.title));
        app.appendChild(el("h1", null, ls.title));
        var qs = ls.questions || [];
        if (!qs.length) { app.appendChild(el("p", "note", "الإجابات لسه مش متاحة")); return }
        var targetEl = null;
        qs.forEach(function(item, i) {
          var card = el("section", "qcard");
          card.id = "q" + i;
          var q = el("div", "q");
          q.appendChild(el("span", "label", "السؤال " + (i + 1)));
          q.appendChild(el("p", "text", item.question));
          addImage(q, item.questionImage, "صورة السؤال " + (i + 1));
          var a = el("div", "a");
          a.appendChild(el("span", "label", "الإجابة:"));
          a.appendChild(el("p", "text", item.answer));
          addImage(a, item.answerImage, "صورة الإجابة " + (i + 1));
          card.appendChild(q);
          card.appendChild(a);
          app.appendChild(card);
          if (target !== undefined && target === i) {
            card.className += " target";
            targetEl = card
          }
        });
        if (targetEl) targetEl.scrollIntoView({ block: "start" });
      }
      
      function route() {
        var p = (location.hash || "#/").replace(/^#\/?/, "").split("/");
        var n = function(v) { var x = parseInt(v, 10); return isNaN(x) ? -1 : x };
        if (p[0] === "c") return renderChapter(n(p[1]));
        if (p[0] === "l") return renderLesson(n(p[1]), n(p[2]), n(p[3]), p[4] !== undefined ? n(p[4]) : undefined);
        renderHome();
      }
      
      if (DATA.siteTitle) {
        document.getElementById("site-title").textContent = DATA.siteTitle;
        document.title = DATA.siteTitle
      }
      buildIndex();
      window.addEventListener("hashchange", route);
      route();
    })();
  </script>

</body></html>
